services:
  db:
    image: postgres:15-alpine
    container_name: my-postgres-db
    environment:
      POSTGRES_PASSWORD: mysecretpassword
    ports:
      - "5432:5432"
      
      
  app:
    build: .
    container_name: my-todo-container
    environment:
      - PYTHONUNBUFFERED=1
    ports:
      - "8080:8000"
    depends_on:
      - db
